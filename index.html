<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ลงทะเบียนผู้เช่า</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

  <div class="bg-white rounded-2xl shadow-lg w-full max-w-md p-6">
    <div class="text-center mb-5">
      <h2 class="text-xl font-bold text-slate-800">🏢 ลงทะเบียนผู้เช่า</h2>
      <p id="status-text" class="text-xs text-blue-600 mt-1 break-all">กำลังเชื่อมต่อ LINE...</p>
    </div>

    <form id="regForm" class="space-y-4">
      <input type="hidden" id="userId">
      <div>
        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">หมายเลขห้องพัก</label>
        <input type="text" id="roomNo" required placeholder="เช่น 101, A203"
          class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm">
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">ชื่อ - นามสกุล</label>
        <input type="text" id="name" required placeholder="ชื่อ-นามสกุล"
          class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm">
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">เบอร์โทรศัพท์</label>
        <input type="tel" id="phone" required placeholder="08xxxxxxxx"
          class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm">
      </div>
      <button type="submit" id="submitBtn"
        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 rounded-lg text-sm">
        ยืนยันการลงทะเบียน
      </button>
    </form>
  </div>
<script>
  const MY_LIFF_ID  = "2011432830-qKeET5Fd";
  const GAS_API_URL = "https://script.google.com/macros/s/AKfycbxjPIGepS85gvULfQ5Oor_C-HE3HgOWIsgKwEmam6Gf10T7y_cS0vZ_-g79bg4XLsRA/exec"; // ต้องลงท้าย /exec

  function setStatus(html, color) {
    const el = document.getElementById('status-text');
    el.innerHTML = html;
    el.className = `text-xs mt-1 break-all ${color}`;
  }

  /* ---------- LIFF INIT ---------- */
  async function initializeLiff() {
    try {
      await liff.init({ liffId: MY_LIFF_ID, withLoginOnExternalBrowser: true });
      if (!liff.isLoggedIn()) { liff.login({ redirectUri: window.location.href }); return; }
      const profile = await liff.getProfile();
      document.getElementById('userId').value = profile.userId;
      if (!document.getElementById('name').value) {
        document.getElementById('name').value = profile.displayName || '';
      }
      setStatus(`✅ บัญชี: <b>${profile.displayName}</b><br><span class="text-slate-500 text-[11px]">LINE UID: ${profile.userId}</span>`, "text-emerald-600");
    } catch (err) {
      setStatus(`❌ ${err.message}`, "text-rose-600");
    }
  }
  window.addEventListener('DOMContentLoaded', initializeLiff);

  /* ---------- JSONP HELPER (แก้ปัญหา Failed to fetch) ---------- */
  function jsonpRequest(baseUrl, params, timeoutMs = 15000) {
    return new Promise((resolve, reject) => {
      const cbName = 'gasCallback_' + Date.now() + Math.floor(Math.random() * 1000);
      const query = Object.keys(params)
        .map(k => encodeURIComponent(k) + '=' + encodeURIComponent(params[k]))
        .join('&');

      const script = document.createElement('script');
      const timer = setTimeout(() => { cleanup(); reject(new Error('หมดเวลาเชื่อมต่อเซิร์ฟเวอร์ (Timeout)')); }, timeoutMs);

      function cleanup() {
        clearTimeout(timer);
        delete window[cbName];
        if (script.parentNode) script.parentNode.removeChild(script);
      }

      window[cbName] = (data) => { cleanup(); resolve(data); };
      script.onerror = () => { cleanup(); reject(new Error('เชื่อมต่อ Apps Script ไม่ได้ (ตรวจสอบสิทธิ์ Anyone)')); };
      script.src = `${baseUrl}?${query}&callback=${cbName}`;
      document.body.appendChild(script);
    });
  }

  /* ---------- SUBMIT ---------- */
  document.getElementById('regForm').addEventListener('submit', async function (e) {
    e.preventDefault();

    const userId = document.getElementById('userId').value;
    if (!userId) {
      Swal.fire({ icon: 'warning', title: 'ไม่พบ LINE User ID', text: 'กรุณาเปิดหน้านี้ผ่านแอป LINE', confirmButtonColor: '#f59e0b' });
      return;
    }

    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.innerText = "กำลังบันทึก...";

    const payload = {
      action : 'register',
      roomNo : document.getElementById('roomNo').value.trim(),
      name   : document.getElementById('name').value.trim(),
      phone  : document.getElementById('phone').value.trim(),
      userId : userId
    };

    try {
      const res = await jsonpRequest(GAS_API_URL, payload);
      if (!res.success) throw new Error(res.message || 'บันทึกข้อมูลไม่สำเร็จ');

      await Swal.fire({
        icon: 'success',
        title: 'ลงทะเบียนสำเร็จ!',
        html: `<div class="text-left text-sm bg-slate-50 p-3 rounded-lg border space-y-1">
                 <div><b>ห้อง:</b> ${payload.roomNo}</div>
                 <div><b>ชื่อ:</b> ${payload.name}</div>
                 <div><b>เบอร์โทร:</b> ${payload.phone}</div>
                 <div class="pt-1 border-t text-xs break-all text-slate-500">
                   <b>LINE UID:</b><br><code class="text-blue-600">${res.userId}</code>
                 </div>
               </div>`,
        confirmButtonText: 'ตกลง',
        confirmButtonColor: '#2563eb'
      });
      if (liff.isInClient()) liff.closeWindow();

    } catch (err) {
      Swal.fire({ icon: 'error', title: 'เกิดข้อผิดพลาด', text: err.message, confirmButtonColor: '#ef4444' });
      btn.disabled = false;
      btn.innerText = "ยืนยันการลงทะเบียน";
    }
  });
</script>
 </body>
</html>
