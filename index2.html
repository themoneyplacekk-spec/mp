<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>ลงทะเบียนผู้เช่า - หอพัก</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  * { box-sizing: border-box; font-family: -apple-system, "Noto Sans Thai", sans-serif; }
  body { margin: 0; background: #F5F7FB; color: #111; }
  .wrap { max-width: 420px; margin: 0 auto; padding: 20px; }
  .card { background: #fff; border-radius: 14px; padding: 20px; box-shadow: 0 2px 10px rgba(0,0,0,.06); }
  h2 { margin: 0 0 4px; font-size: 20px; }
  .sub { color: #888; font-size: 13px; margin-bottom: 18px; }
  label { display: block; font-size: 13px; color: #555; margin: 14px 0 6px; }
  input { width: 100%; padding: 12px; border: 1px solid #DDE3EC; border-radius: 10px; font-size: 15px; }
  button { width: 100%; padding: 14px; border: 0; border-radius: 10px; background: #2E86C1; color: #fff;
           font-size: 16px; font-weight: 600; margin-top: 20px; }
  button:disabled { background: #B9C6D8; }
  .msg { padding: 12px; border-radius: 10px; font-size: 14px; margin-top: 14px; display: none; white-space: pre-line; }
  .ok { background: #E8F5E9; color: #1B7F3B; }
  .err { background: #FDECEA; color: #C1352B; }
  .profile { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .profile img { width: 44px; height: 44px; border-radius: 50%; }
  .profile span { font-size: 14px; color: #555; }
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h2>📋 ลงทะเบียนผู้เช่า</h2>
    <div class="sub">กรอกข้อมูลเพื่อผูกบัญชี LINE กับห้องพักของคุณ</div>

    <div class="profile" id="profileBox" style="display:none;">
      <img id="profileImg" src="">
      <span id="profileName"></span>
    </div>

    <label>เลขห้อง *</label>
    <input id="room" placeholder="เช่น 101">

    <label>ชื่อ-นามสกุล *</label>
    <input id="name" placeholder="ชื่อ-นามสกุลจริง">

    <label>เบอร์โทรศัพท์ *</label>
    <input id="phone" type="tel" placeholder="08xxxxxxxx">

    <button id="btnSubmit" onclick="submitForm()">ลงทะเบียน</button>
    <div class="msg" id="msgBox"></div>
  </div>
</div>

<script>
/* ================= ตั้งค่าตรงนี้ ================= */
const LIFF_ID = "2011432830-qKeET5Fd"; // LIFF ID ของ LINE Login Channel
const GAS_URL = "https://script.google.com/macros/s/AKfycbwOfApE3FmlZlbyv6W3iAICNNreiDPFd7nnAcn08tljLKiEkGOwCYiszZowNIziIF2z/exec"; // Web App URL ของคุณ
const SECRET  = "your-api-secret-string"; // รหัสผ่านลับที่ตั้งไว้ใน Config.gs
/* ============================================== */

let idToken = '', userId = '';

document.addEventListener('DOMContentLoaded', init);

async function init() {
  try {
    await liff.init({ liffId: LIFF_ID });
    if (!liff.isLoggedIn()) { liff.login(); return; }

    idToken = liff.getIDToken();
    const profile = await liff.getProfile();
    userId = profile.userId;

    document.getElementById('profileBox').style.display = 'flex';
    document.getElementById('profileImg').src = profile.pictureUrl || '';
    document.getElementById('profileName').textContent = profile.displayName;
    document.getElementById('name').value = profile.displayName;

    // โหลดข้อมูลเก่า (ถ้าเคยลงทะเบียนแล้ว)
    callApi({ action: 'get_tenant_info' }).then(res => {
      if (res.ok && res.tenant) {
        document.getElementById('room').value = res.tenant.room || '';
        document.getElementById('name').value = res.tenant.name || '';
        document.getElementById('phone').value = res.tenant.phone || '';
      }
    });
  } catch (err) {
    showMsg('เกิดข้อผิดพลาดในการเชื่อมต่อ LINE กรุณาเปิดหน้านี้ผ่านแอป LINE เท่านั้นค่ะ', false);
  }
}

async function callApi(payload) {
  try {
    const res = await fetch(GAS_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(Object.assign({ secret: SECRET, idToken: idToken, userId: userId }, payload))
    });
    return await res.json();
  } catch (e) {
    return { ok: false, message: 'ไม่สามารถติดต่อเซิร์ฟเวอร์ได้: ' + e.message };
  }
}

async function submitForm() {
  const room = document.getElementById('room').value.trim();
  const name = document.getElementById('name').value.trim();
  const phone = document.getElementById('phone').value.trim();

  if (!room || !name || !phone) {
    showMsg('กรุณากรอกข้อมูลให้ครบทุกช่องค่ะ', false);
    return;
  }

  lockButton(true);
  const res = await callApi({ action: 'register', room: room, name: name, phone: phone });
  lockButton(false);
  
  showMsg(res.message, res.ok);
  if (res.ok) setTimeout(() => liff.closeWindow(), 2000);
}

function showMsg(text, ok) {
  const el = document.getElementById('msgBox');
  el.textContent = text;
  el.className = 'msg ' + (ok ? 'ok' : 'err');
  el.style.display = 'block';
}

function lockButton(locked) {
  const btn = document.getElementById('btnSubmit');
  btn.disabled = locked;
  btn.textContent = locked ? 'กำลังบันทึก...' : 'ลงทะเบียน';
}
</script>
</body>
</html>
